version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermine
      POSTGRES_USER: mattermine
      POSTGRES_PASSWORD: mattermine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermine"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MATTERMOST_URL: "${MATTERMOST_URL}"
      MATTERMOST_TOKEN: "${MATTERMOST_TOKEN}"
      DATABASE_URL: "postgres://mattermine:mattermine@db:5432/mattermine"
      RUST_LOG: "mattermine=info"

volumes:
  pgdata:
